
plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.0.6'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'jacoco'
}


group 'innkeeper.run'
version '1.0'
sourceCompatibility = '21'

repositories {
    mavenCentral()
}

ext {
    set('springBootAdminVersion', "3.0.3")
}

dependencies {
    implementation group: 'io.fabric8', name: 'kubernetes-client', version: '6.7.1'
    implementation 'io.fabric8:crd-generator-apt:6.5.1'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.4'
    implementation 'com.puppycrawl.tools:checkstyle:10.9.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.security:spring-security-core:6.1.0'
    implementation 'org.springframework.security:spring-security-messaging:6.1.0'
    implementation 'cz.habarta.typescript-generator:typescript-generator-core:3.2.1263'

    implementation 'org.apache.commons:commons-lang3:3.12.0'

    annotationProcessor 'io.fabric8:crd-generator-apt:6.5.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.1'
    implementation group: 'me.snowdrop', name: 'istio-client', version: '1.7.7.1'
    implementation  'io.javaoperatorsdk:operator-framework:4.2.8'
    implementation group: 'org.reflections', name: 'reflections', version: '0.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'net.bytebuddy:byte-buddy:1.14.12'
    testImplementation 'net.bytebuddy:byte-buddy-agent:1.14.12'
    testImplementation 'io.fabric8:kubernetes-server-mock:6.7.1'
    implementation 'ch.qos.logback:logback-classic:1.4.6'
    implementation 'com.github.java-json-tools:json-patch:1.13'
    implementation 'org.glassfish:javax.json:1.1.4'

    implementation 'org.apache.httpcomponents:httpclient:4.5.5'





}

dependencyManagement {
    imports {
        mavenBom "de.codecentric:spring-boot-admin-dependencies:${springBootAdminVersion}"
    }
}

test {
    useJUnitPlatform()
    jvmArgs = [
        '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.invoke=ALL-UNNAMED',
    ]
    systemProperty 'kubernetes.master', 'https://localhost:6443'
    systemProperty 'kubernetes.auth.tryKubeConfig', 'false'
    systemProperty 'kubernetes.auth.tryServiceAccount', 'false'
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

application {
    mainClass = 'run.innkeeper.Main'
}